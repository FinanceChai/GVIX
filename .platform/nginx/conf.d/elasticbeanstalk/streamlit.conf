# server-level locations for Streamlit, included inside EB's server {} block.
# Streamlit serves its app over HTTP and its live updates over a WebSocket at
# /_stcore/stream — that endpoint needs the Upgrade/Connection headers.

location /_stcore/stream {
    proxy_pass          http://127.0.0.1:8000/_stcore/stream;
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection $connection_upgrade;
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  86400;
    proxy_send_timeout  86400;
}

# Streamlit health endpoint (used by the EB/ALB health check).
location /_stcore/health {
    proxy_pass       http://127.0.0.1:8000/_stcore/health;
    proxy_set_header Host $host;
}
